name: Build OHE Compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Show environment
        run: |
          java -version
          gradle --version

      - name: Build
        run: gradle clean build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: OHE-Compatibility-JAR
          path: build/libs/*.jar
          if-no-files-found: error
